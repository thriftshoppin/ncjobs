<title>Night City Work Stations</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Concept: every job is a JOBSHARD your chrome runs. The frame is an optics HUD (corner brackets,
   scanlines, a boot line); the vendor sets the colours; the job TYPE sets the layout:
     bar        drinks: the glass on the left, steps on the right
     line       food: a wide cook line on top, the ticket and controls below
     scan       garage, car lot: a scanner schematic on top, readouts below
     precision  ink, ripperdoc: a big working canvas beside a slim step list
     pos        shops: a counter strip on top, a big point-of-sale grid below
     ritual     Misty's: the table on top, the reading below
   Installed chrome shows up as ASSISTS that change the games.
   Single committed dark look: these screens are drawn over the game. */
:root {
  --night: #070a10; --panel: rgba(10, 14, 22, 0.95); --panel-2: #121927; --line: #26304a;
  --text: #e6edf3; --muted: #8b97a8; --ok: #3ce8a0; --bad: #ff3b5c; --warn: #fcee0a;
  --a: #ff5f58; --b: #5ef6ff; --ground: #0a0d14; --ink: #160606;
  --f-display: "Rajdhani", "Bahnschrift", "Arial Narrow", sans-serif;
  --f-body: "Barlow Semi Condensed", "Segoe UI", "Arial Narrow", sans-serif;
  --f-mono: "Share Tech Mono", "Consolas", monospace;
  color-scheme: dark;
}
[data-skin="afterlife"] { --a: #e3263a; --b: #efe6d6; --ground: #120708; --ink: #fff; }
[data-skin="noodle"]    { --a: #ffb02e; --b: #2ee6c9; --ground: #0b1110; --ink: #1a0d00; }
[data-skin="hawt"]      { --a: #ff6a2b; --b: #ffe14d; --ground: #120a06; --ink: #1a0600; }
[data-skin="coffee"]    { --a: #d08a4e; --b: #f3e2c7; --ground: #120d0a; --ink: #1a0c02; }
[data-skin="garage"]    { --a: #f5d300; --b: #9fd3ff; --ground: #0c0e10; --ink: #141100; }
[data-skin="ink"]       { --a: #ff3fb4; --b: #a57bff; --ground: #100914; --ink: #1a0010; }
[data-skin="ripper"]    { --a: #3df2b0; --b: #e8fff6; --ground: #08110f; --ink: #00160d; }
[data-skin="junk"]      { --a: #e0702b; --b: #b8c47a; --ground: #100c08; --ink: #1a0800; }
[data-skin="misty"]     { --a: #b48cff; --b: #e9c46a; --ground: #0e0a16; --ink: #12002b; }
[data-skin="autofixer"] { --a: #34d5ff; --b: #ffd23f; --ground: #081016; --ink: #001722; }
[data-skin="threads"]   { --a: #ff4f8b; --b: #d6dbe4; --ground: #110a0e; --ink: #1c0010; }

html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--text); font: 16px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--b); outline-offset: 2px; }
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

.rail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.rail button { flex: 0 0 auto; background: var(--panel-2); border: 1px solid var(--line); padding: 6px 11px;
  font: 600 14px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rail button[aria-pressed="true"] { color: var(--text); border-color: var(--a); box-shadow: inset 0 -2px 0 var(--a); }
.rail button small { display: block; font: 10px var(--f-mono); letter-spacing: .08em; color: var(--muted); text-transform: none; }

/* the HUD frame */
.hud { position: relative; background: var(--panel); border: 1px solid color-mix(in srgb, var(--a) 35%, transparent);
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
    radial-gradient(120% 80% at 0% 0%, color-mix(in srgb, var(--a) 12%, transparent), transparent 60%), linear-gradient(var(--ground), var(--ground)); }
.hud::before, .hud::after { content: ""; position: absolute; width: 22px; height: 22px; border: 2px solid var(--a); pointer-events: none; }
.hud::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.hud::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }
.boot { font: 11px var(--f-mono); letter-spacing: .14em; color: var(--a); padding: 8px 20px 0; text-transform: uppercase; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.boot .live::before { content: "● "; color: var(--ok); }
.boot.booting .live { animation: blink .25s steps(2) 3; }
@keyframes blink { 50% { opacity: 0; } }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 4px 20px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.title { font: 700 26px/1.1 var(--f-display); letter-spacing: .04em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.who { font: 13px var(--f-mono); color: var(--muted); }
.assists { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.assist { font: 11px var(--f-mono); letter-spacing: .06em; padding: 4px 8px; border: 1px dashed var(--line); background: transparent; color: var(--muted); text-align: left; }
.assist[aria-pressed="true"] { border-style: solid; border-color: var(--b); color: var(--b); }
.assist small { display: block; color: var(--muted); font-size: 10px; }

.body { display: grid; gap: 16px; padding: 14px 20px; }
.visual { display: grid; place-items: center; gap: 6px; min-width: 0; }
canvas.art { width: 100%; max-width: 100%; touch-action: none; background: color-mix(in srgb, var(--ground) 60%, #000); border: 1px solid var(--line); }
.timer { font: 12px var(--f-mono); color: var(--muted); }
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.step { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; background: var(--panel-2); border-left: 3px solid transparent; min-width: 0; }
.step.active { border-left-color: var(--a); }
.step.done { opacity: .7; }
.dot { width: 10px; height: 10px; border: 1px solid var(--muted); transform: rotate(45deg); }
.step.active .dot { border-color: var(--a); }
.step.done .dot { background: var(--ok); border-color: var(--ok); }
.step.done.g-good .dot { background: var(--b); border-color: var(--b); }
.step.done.g-off .dot { background: var(--bad); border-color: var(--bad); }
.grade { font: 12px var(--f-mono); }
.grade.perfect { color: var(--ok); } .grade.good { color: var(--b); } .grade.off { color: var(--bad); }

/* layouts by job type */
[data-layout="bar"] .body { grid-template-columns: 220px 1fr; }
[data-layout="precision"] .body { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
[data-layout="line"] .steps, [data-layout="scan"] .steps, [data-layout="pos"] .steps, [data-layout="ritual"] .steps { flex-direction: row; flex-wrap: wrap; }
[data-layout="line"] .step, [data-layout="scan"] .step, [data-layout="pos"] .step, [data-layout="ritual"] .step { flex: 1 1 150px; }
[data-layout="pos"] canvas.art { max-height: 160px; object-fit: contain; }
@media (max-width: 680px) { [data-layout="bar"] .body, [data-layout="precision"] .body { grid-template-columns: 1fr; } [data-layout="bar"] canvas.art { max-width: 220px; } }

.control { background: var(--panel-2); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 130px; border-left: 2px solid color-mix(in srgb, var(--a) 50%, transparent); }
.readout { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 700 21px var(--f-display); flex-wrap: wrap; }
.readout .num { font: 24px var(--f-mono); color: var(--b); font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: 14px; }
.big { width: 100%; padding: 14px; background: transparent; border: 1px solid var(--a); color: var(--a);
  font: 700 17px var(--f-display); letter-spacing: .14em; text-transform: uppercase; touch-action: none; user-select: none; }
.big.on, .big:active { background: var(--a); color: var(--ink); }
.key { font: 11px var(--f-mono); opacity: .7; margin-left: 6px; letter-spacing: .05em; }
.dial { width: 100%; height: 34px; margin: 0; accent-color: var(--a); cursor: pointer; }
.meter { position: relative; height: 22px; background: #0b0f18; border: 1px solid var(--line); }
.meter .zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--b) 18%, transparent); border-inline: 1px solid var(--b); }
.meter .core { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--ok) 30%, transparent); }
.meter .needle { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--warn); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }
.choices button { background: transparent; border: 1px solid var(--line); padding: 10px 8px; text-align: left; }
.choices button:hover { border-color: var(--a); }
.choices button.right { border-color: var(--ok); color: var(--ok); }
.choices button.wrong { border-color: var(--bad); color: var(--bad); }
.choices button small { display: block; font: 11px var(--f-mono); color: var(--muted); }
[data-layout="pos"] .choices button { padding: 18px 12px; font: 700 18px var(--f-display); letter-spacing: .04em; }
.readings { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; font: 14px var(--f-mono); }
.readings .val { text-align: right; color: var(--b); }
.readings .val.flag { color: var(--warn); }
.readings .val.flag::before { content: "▲ "; }
.item { font: 700 22px var(--f-display); letter-spacing: .03em; }
.item small { display: block; font: 12px var(--f-mono); color: var(--muted); letter-spacing: .06em; }
.ticket { display: flex; gap: 6px; flex-wrap: wrap; }
.ticket span { font: 13px var(--f-mono); padding: 4px 8px; border: 1px solid var(--line); }
.ticket span.got { border-color: var(--ok); color: var(--ok); }
.tarot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { aspect-ratio: 2 / 3; border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; padding: 8px; background: linear-gradient(160deg, color-mix(in srgb, var(--a) 22%, var(--panel-2)), var(--panel-2)); min-width: 0; max-height: 220px; }
.card.face { border-color: var(--b); }
.card .pos { font: 10px var(--f-mono); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.card .name { font: 700 16px/1.1 var(--f-display); color: var(--b); text-transform: uppercase; }
.card .mean { font-size: 12px; color: var(--muted); }
.foot { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 12px 20px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: transparent; padding: 10px 16px; font: 700 15px var(--f-display); letter-spacing: .12em; text-transform: uppercase; }
.btn.primary { background: var(--a); border-color: var(--a); color: var(--ink); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.note { font: 12px var(--f-mono); color: var(--muted); }
.result { display: flex; justify-content: space-between; align-items: baseline; font: 700 22px var(--f-display); }
.result .num { color: var(--b); font: 28px var(--f-mono); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <nav class="rail" id="rail" aria-label="Stations"></nav>
  <section class="hud" id="hud" aria-labelledby="title">
    <div class="boot" id="boot"><span id="bootText">JOBSHARD</span><span class="live" id="bootLive">LINKED</span></div>
    <div class="head">
      <div><h1 class="title" id="title">—</h1><div class="who" id="who">—</div></div>
      <div class="assists" id="assists" aria-label="Chrome assists"></div>
    </div>
    <div class="body">
      <div class="visual"><canvas class="art" id="art" width="400" height="560"></canvas><div class="timer" id="timer">0.0 s</div></div>
      <div class="side"><ol class="steps" id="steps"></ol><div class="control" id="control"></div></div>
    </div>
    <div class="foot">
      <span class="note">Preview. In game the server times every job and re-scores it.</span>
      <div style="display:flex;gap:8px"><button class="btn" id="restart">Start over</button><button class="btn primary" id="finish" disabled>Hand it over</button></div>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ===================================================================================
     Chrome assists: real implants (CYBERWARE tab). In game the server reads what's installed.
     =================================================================================== */
  const ASSISTS = {
    kiroshi:    { name: "Kiroshi Optics",        rec: "Items.AdvancedKiroshiOpticsBareCommon", does: "wider target zones" },

  };
  const on = k => st.assists.has(k);
  // Pace by job title (rp_jobs grade), then chrome on top.
  const RANK = { speed: 1.2, perfect: 4, good: 12, zone: 0.24 };
  function diff() {
    const d = { ...RANK, fall: 1, chopSpeed: 1, trace: 1, showMs: 3000, window: 1 };
    if (on("kiroshi")) { d.perfect += 3; d.good += 4; d.zone += 0.06; }
    if (on("reflex")) { d.speed *= 0.8; d.fall *= 0.75; d.chopSpeed *= 0.8; }
    if (on("smartlink")) d.trace = 1.45;
    if (on("memory")) d.showMs = 5000;
    if (on("biomonitor") && st.job.id === "ripper") d.zone += 0.08;
    if (on("kerenzikov")) d.window = 1.6;
    return d;

  const VESSELS = {

       food     chop (cut on the marks), catch (catch the toss), fry (juggle baskets), assemble (build from memory)

  /* ============================ frame loop ============================ */

  /* ============================ drawing ============================ */

  function drawKeep(g, W, H, s) {

  function drawTrace(g, W, H, s) {

    for (let k = 0; k < 3; k++) { const x = W * (0.3 + k * 0.2); g.fillStyle = "#e9e1cf"; g.fillRect(x - 14, H * 0.45, 28, H * 0.4);
      if (k < lit) { g.fillStyle = css("--b"); g.beginPath(); g.ellipse(x, H * 0.4 + Math.sin(now / 120 + k) * 3, 9, 18, 0, 0, 7); g.fill(); } } }
  function drawRack(g, W, H) { g.strokeStyle = css("--b"); g.lineWidth = 3; g.beginPath(); g.moveTo(40, H * 0.2); g.lineTo(W - 40, H * 0.2); g.stroke();
    for (let k = 0; k < 8; k++) { const x = 90 + k * ((W - 180) / 7); g.strokeStyle = css("--a");
      g.beginPath(); g.moveTo(x, H * 0.2); g.lineTo(x, H * 0.3); g.lineTo(x - 30, H * 0.42); g.lineTo(x - 26, H * 0.85); g.lineTo(x + 26, H * 0.85); g.lineTo(x + 30, H * 0.42); g.lineTo(x, H * 0.3); g.stroke(); } }

  /* ============================ input ============================ */
  const art = $("art");
  const local = e => { const r = art.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  const gaugeInput = x => { if (st.done || cur().type !== "keep" || !st.live.init) return; const L = st.live;
    L.target = clamp((x - 0.08) / 0.84, 0, 1); L.started = true; const dl = $("dial"); if (dl) dl.value = Math.round(L.target * 1000); };
  art.onpointerdown = e => { art.setPointerCapture(e.pointerId); st.live.drag = true; st.live.lifted = true; const [x, y] = local(e); traceInput(x, y); gaugeInput(x); if (!st.done && cur().type === "catch" && st.live.pieces) st.live.wok = clamp(x, 0.08, 0.92); };
  art.onpointermove = e => { const [x, y] = local(e); if (!st.done && cur().type === "catch" && st.live.pieces) st.live.wok = clamp(x, 0.08, 0.92); if (st.live.drag) { traceInput(x, y); gaugeInput(x); } };
  art.onpointerup = art.onpointercancel = () => { st.live.drag = false; };
  document.addEventListener("keydown", e => {
    if (st.done) return; const s = cur();
    if (/^[1-4]$/.test(e.key)) { if (s.type === "sort") sortPick(+e.key - 1); if (s.type === "pick") choose(+e.key - 1); if (s.type === "fry") pull(+e.key - 1); return; }
    if (s.type === "catch" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { e.preventDefault(); st.live.keyDir = e.key === "ArrowLeft" ? -1 : 1; return; }
    if (s.type === "keep" && /^Arrow(Left|Right|Up|Down)$/.test(e.key) && document.activeElement !== $("dial")) {
      e.preventDefault(); const L = st.live, dir = /Left|Down/.test(e.key) ? -1 : 1;
      L.target = clamp(L.target + dir * 0.03, 0, 1); L.started = true; const dl = $("dial"); if (dl) dl.value = Math.round(L.target * 1000); return; }
    if (e.code !== "Space") return; e.preventDefault(); if (e.repeat) return;
    if (s.type === "hold") startHold();
    else if (["count", "beat", "cards", "chop"].includes(s.type)) press();
  });
  document.addEventListener("keyup", e => {
    if (st.done) return; const s = cur();
    if (s.type === "catch" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) st.live.keyDir = 0;
    if (e.code !== "Space") return;
    if (s.type === "hold") stopHold();
  });
  $("restart").onclick = start;
  $("finish").onclick = () => { st.orderIx = (st.orderIx + 1) % st.job.orders.length; start(); };

  let saved = null; try { saved = localStorage.getItem("o77.station"); } catch (e) {}
  selectJob(JOBS.find(j => j.id === (location.hash.slice(1) || saved)) || JOBS[0]);
})();
</script>
